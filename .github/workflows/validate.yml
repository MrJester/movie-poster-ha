name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install frontend test environment
        run: npm install
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test responsive renderer
        run: >-
          npx playwright test
          --project=${{ matrix.browser }}
          --shard=${{ matrix.shard }}/2

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["2026.5", "2026.6", "2026.7"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - name: Install test environment
        run: pip install -e '.[test]' "homeassistant~=${{ matrix.home-assistant }}.0"
      - name: Validate backend
        run: ./scripts/validate backend
