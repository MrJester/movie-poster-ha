name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        # Automatic test-count sharding grouped every expensive viewport test
        # into one runner. Partition that matrix explicitly, then shard the
        # remaining acceptance tests independently.
        suite: [responsive-0, responsive-1, acceptance-1, acceptance-2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install frontend test environment
        run: npm install
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test responsive matrix
        if: startsWith(matrix.suite, 'responsive-')
        env:
          RESPONSIVE_VIEWPORT_SHARD_COUNT: "2"
          RESPONSIVE_VIEWPORT_SHARD: ${{ endsWith(matrix.suite, '-0') && '0' || '1' }}
        run: >-
          npx playwright test
          --project=${{ matrix.browser }}
          --workers=1
          --grep=@responsive-matrix
      - name: Test renderer acceptance
        if: startsWith(matrix.suite, 'acceptance-')
        run: >-
          npx playwright test
          --project=${{ matrix.browser }}
          --workers=1
          --grep-invert=@responsive-matrix
          --shard=${{ endsWith(matrix.suite, '-1') && '1' || '2' }}/2

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        home-assistant: ["2026.5", "2026.6", "2026.7"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - name: Install test environment
        run: pip install -e '.[test]' "homeassistant~=${{ matrix.home-assistant }}.0"
      - name: Validate backend
        run: ./scripts/validate backend
